<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Lucas Freitas — software engineer, AI workflows, Berlin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f5f8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2bc4d6"/>
      <stop offset="1" stop-color="#7c6cf0"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#0d1117" opacity="0.06"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="1000" height="220" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="220" rx="16" fill="url(#dots)"/>
  <rect x="0" y="214" width="1000" height="6" fill="url(#accent)"/>

  <!-- window chrome -->
  <circle cx="34" cy="32" r="6" fill="#ff5f57"/>
  <circle cx="54" cy="32" r="6" fill="#febc2e"/>
  <circle cx="74" cy="32" r="6" fill="#28c840"/>
  <text x="100" y="37" class="mono" font-size="13" fill="#6e7681">~/berlin — zsh</text>

  <text x="56" y="92" class="mono" font-size="18" fill="#6e7681">$ <tspan fill="#1f2328">whoami</tspan></text>
  <text x="56" y="140" class="mono" font-size="44" font-weight="700" fill="#1f2328">Lucas Freitas</text>
  <text x="56" y="178" class="mono" font-size="18" fill="#0e8fa0">software engineer<tspan fill="#6e7681"> · </tspan><tspan fill="#5b4dd6">AI workflows</tspan><tspan fill="#6e7681"> · </tspan><tspan fill="#d08a5c">Berlin 🇩🇪</tspan><tspan class="cursor" fill="#1f2328"> ▍</tspan></text>

  <!-- tiny pixel bonsai, matching the tree below -->
  <g transform="translate(820 52)" shape-rendering="crispEdges">
    <rect x="8"  y="0"  width="40" height="8" fill="#2bc4d6"/>
    <rect x="0"  y="8"  width="56" height="8" fill="#2bc4d6"/>
    <rect x="16" y="16" width="48" height="8" fill="#7c6cf0"/>
    <rect x="24" y="24" width="32" height="8" fill="#7c6cf0"/>
    <rect x="48" y="24" width="16" height="8" fill="#8b4a2b"/>
    <rect x="64" y="32" width="16" height="16" fill="#8b4a2b"/>
    <rect x="72" y="48" width="16" height="24" fill="#8b4a2b"/>
    <rect x="80" y="72" width="16" height="16" fill="#8b4a2b"/>
    <rect x="32" y="88" width="104" height="8" fill="#b5653d"/>
    <rect x="40" y="96" width="88" height="16" fill="#8b4a2b"/>
    <rect x="48" y="112" width="8" height="6" fill="#3a2418"/>
    <rect x="112" y="112" width="8" height="6" fill="#3a2418"/>
  </g>
</svg>
